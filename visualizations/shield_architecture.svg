<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
  </defs>
  <rect x="10" y="10" width="520" height="310" rx="10" fill="#eef6ee" stroke="#6a9a6a"/>
  <text x="25" y="35" font-weight="bold">Edge (trusted: holds plaintext and secret key)</text>
  <rect x="580" y="10" width="310" height="310" rx="10" fill="#eef0f8" stroke="#6a78b0"/>
  <text x="595" y="35" font-weight="bold">Remote compute (untrusted)</text>

  <rect x="25" y="60" width="130" height="60" rx="6" fill="#fff" stroke="#333"/>
  <text x="90" y="86" text-anchor="middle">Network flows</text><text x="90" y="104" text-anchor="middle">feature extraction</text>

  <rect x="195" y="60" width="130" height="60" rx="6" fill="#fff" stroke="#333"/>
  <text x="260" y="86" text-anchor="middle">Local plaintext</text><text x="260" y="104" text-anchor="middle">classifier</text>

  <rect x="365" y="40" width="150" height="46" rx="6" fill="#fff" stroke="#333"/>
  <text x="440" y="68" text-anchor="middle">Confident: resolve</text>

  <rect x="195" y="170" width="130" height="60" rx="6" fill="#fff" stroke="#333"/>
  <text x="260" y="196" text-anchor="middle">Ambiguous flows:</text><text x="260" y="214" text-anchor="middle">CKKS encrypt</text>

  <rect x="365" y="240" width="150" height="60" rx="6" fill="#fff" stroke="#333"/>
  <text x="440" y="266" text-anchor="middle">CKKS decrypt</text><text x="440" y="284" text-anchor="middle">final decision</text>

  <rect x="610" y="170" width="250" height="90" rx="6" fill="#fff" stroke="#333"/>
  <text x="735" y="196" text-anchor="middle">Encrypted evaluation</text>
  <text x="735" y="216" text-anchor="middle">(polynomial model, CPU today;</text>
  <text x="735" y="236" text-anchor="middle">GPU backend not yet verified)</text>

  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M155,90 H195"/>
    <path d="M325,75 H365"/>
    <path d="M260,120 V170"/>
    <path d="M325,200 H610"/>
    <path d="M735,260 V285 H515"/>
  </g>
  <text x="270" y="150" font-size="12">low confidence</text>
  <text x="430" y="192" font-size="12">ciphertext</text>
  <text x="640" y="300" font-size="12">encrypted result</text>
</svg>
